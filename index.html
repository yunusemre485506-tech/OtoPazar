<head>

<title>OtoPazar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#111}

<header><h1>🚗 OtoPazar</h1></header>
<nav><button>İlanlar</button><button>İlan Ver</button><button>Favoriler</button></nav>
